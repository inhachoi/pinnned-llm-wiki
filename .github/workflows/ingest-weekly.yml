name: Weekly Ingest

# 매주 금요일 06:00 KST — 지난 금요일부터 머지된 PR과 노션 회의록, raw/의 새 파일을 읽어 위키를 갱신한다.
# 격주 목요일 밤 회의 결정이 금요일 아침 작업 전에 반영되게 하는 시각이다. 회의록을 그 뒤에 정리했으면 수동 실행한다.
# 절차는 .github/ingest/PROMPT.md, 규칙은 AGENTS.md. 사람 승인 없이 점검을 통과하면 main에 반영한다.
# CLAUDE_CODE_OAUTH_TOKEN 시크릿이 없으면 아무것도 하지 않고 끝난다. NOTION_TOKEN이 없으면 노션만 건너뛴다.
on:
  schedule:
    - cron: "0 21 * * 4"
  workflow_dispatch:
    inputs:
      since:
        description: "대상 시작 (YYYY-MM-DD). 비우면 지난 금요일"
        required: false
      until:
        description: "대상 끝 (YYYY-MM-DD). 비우면 오늘"
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check token
        id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN 없음 — 건너뜀"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Compute period (KST)
        if: steps.gate.outputs.run == 'true'
        id: period
        env:
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_UNTIL: ${{ inputs.until }}
        run: |
          set -euo pipefail
          export TZ=Asia/Seoul
          # 가장 최근 금요일(오늘이 금요일이면 오늘)에서 7일 전부터 오늘까지. 경계일은 양쪽 실행에 겹쳐 들어가고 수집이 중복을 거른다.
          this_friday=$(date -d "$(date +%Y-%m-%d) -$(( ($(date +%u) + 2) % 7 )) days" +%Y-%m-%d)
          last_friday=$(date -d "$this_friday -7 days" +%Y-%m-%d)
          echo "since=${INPUT_SINCE:-$last_friday}" >> "$GITHUB_OUTPUT"
          echo "until=${INPUT_UNTIL:-$(date +%Y-%m-%d)}" >> "$GITHUB_OUTPUT"
          echo "today=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # 노션 토큰은 이 단계에만 준다. 뒤의 에이전트 단계는 내려받은 파일만 읽는다.
      # 노션이 실패해도(연결 미공유, 장애) PR 수집은 계속한다. 실패는 이 단계의 경고로 남는다.
      - name: Fetch Notion meeting notes
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/notion-fetch.mjs --since "${{ steps.period.outputs.since }}" --until "${{ steps.period.outputs.until }}"

      - name: Configure git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "wiki-ingest[bot]"
          git config user.email "wiki-ingest@users.noreply.github.com"

      - name: Run Claude ingest
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            .github/ingest/PROMPT.md 를 읽고 그대로 수행한다.
            대상 기간 since=${{ steps.period.outputs.since }} until=${{ steps.period.outputs.until }}
            오늘=${{ steps.period.outputs.today }}
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(node:*),Bash(gh:*),Bash(git:*),Read,Edit,Write,Glob,Grep"
